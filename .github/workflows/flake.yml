# .github/workflows/flake.yml
name: Update flake lock, build/eval on commit/PRs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 1'   # Mondays 00:00 UTC (08:00 Manila)
  workflow_dispatch:

concurrency:
  group: flake-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Weekly / manual: update the lock and open a PR
  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/update-flake-lock@main
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}   # PAT or GitHub App token, see note
          pr-title: "chore: update flake.lock"
          pr-labels: |
            dependencies
            automated

  # Push / PR: evaluate everything
  flake-check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check --no-build

  # Push / PR: per-host dry-run (and build) in parallel
  host:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: desktop
            build: false   # 32GB closure: eval + dry-run only
          - host: vm
            build: true    # 12GB: real build as smoke test
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: matrix.build
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Eval and dry-run
        run: |
          attr=".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
          nix eval --raw "$attr.drvPath"; echo
          nix build --dry-run "$attr"

      - name: Build
        if: matrix.build
        run: nix build --no-link ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
