name: Update flake lock, eval on commit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 1'   # Mondays 00:00 UTC (08:00 Manila)
  workflow_dispatch:

concurrency:
  group: flake-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Only runs on schedule/manual: update once, share the lock with other jobs
  lock:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake update
      - uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock

  flake-check:
    needs: lock
    if: ${{ !cancelled() && (needs.lock.result == 'success' || needs.lock.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.lock.result == 'success'
        with:
          name: flake-lock
          path: .
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check --no-build

  host:
    needs: lock
    if: ${{ !cancelled() && (needs.lock.result == 'success' || needs.lock.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: desktop
            build: false   # 32GB closure: eval + dry-run only
          - host: vm
            build: true    # 12GB: real build as smoke test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.lock.result == 'success'
        with:
          name: flake-lock
          path: .

      - name: Free disk space
        if: matrix.build
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false   # slow to remove, rarely worth it

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Eval and dry-run
        run: |
          attr=".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
          nix eval --raw "$attr.drvPath"; echo
          nix build --dry-run "$attr"

      - name: Build
        if: matrix.build
        run: nix build --no-link ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  # Only after every check above passed
  pr:
    needs: [lock, flake-check, host]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flake-lock
          path: .
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update flake.lock"
          title: "chore: update flake.lock"
          branch: update-flake-lock
          delete-branch: true
          labels: |
            dependencies
            automated
